<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>Polarization from Rayleigh scattering</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker></defs><rect width="800" height="420" rx="20" fill="#f1f6fc"/><text x="30" y="44" font-family="Arial,Noto Sans TC,sans-serif" font-size="24.66070837471036" fill="#182238">At 90 degrees, only the transverse dipole radiates to you</text><path d="M45 220L370 220" fill="none" stroke="#b86a06" stroke-width="6" marker-end="url(#tip)"/><circle cx="400" cy="220" r="25" stroke="#175da8" stroke-width="3" fill="#dbeafa"/><path d="M400 190L400 85" fill="none" stroke="#175da8" stroke-width="5" marker-end="url(#tip)"/><path d="M400 145L400 295" fill="none" stroke="#c73c53" stroke-width="4"/><circle cx="400" cy="220" r="48" stroke="#175da8" stroke-width="3" fill="none"/><circle cx="400" cy="220" r="5" stroke="#175da8" stroke-width="3" fill="#175da8"/><text x="40" y="275" font-family="Arial,Noto Sans TC,sans-serif" font-size="25" fill="#182238">Incident sunlight</text><text x="455" y="115" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#182238">Observer at 90 degrees</text><text x="38" y="345" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#175da8">E into/out of page radiates upward</text><text x="38" y="385" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#c73c53">E along the viewing direction cannot radiate toward you</text><path d="M650 205L650 285" fill="none" stroke="#c73c53" stroke-width="4" marker-end="url(#tip)"/><text x="570" y="325" font-family="Arial,Noto Sans TC,sans-serif" font-size="22" fill="#c73c53">Induced E</text></svg>