<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><title>Rayleigh 散射產生偏振</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker></defs><rect width="800" height="420" rx="20" fill="#f1f6fc"/><text x="30" y="44" font-family="Arial,Noto Sans TC,sans-serif" font-size="25" fill="#182238">在 90° 方向，只收到橫向偶極的散射光</text><path d="M45 220L370 220" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#tip)"/><circle cx="400" cy="220" r="25" stroke="#175da8" stroke-width="3" fill="#dbeafa"/><path d="M400 190L400 85" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#tip)"/><path d="M400 145L400 295" fill="none" stroke="#175da8" stroke-width="2"/><circle cx="400" cy="220" r="48" stroke="#175da8" stroke-width="3" fill="none"/><circle cx="400" cy="220" r="5" stroke="#175da8" stroke-width="3" fill="#175da8"/><text x="40" y="275" font-family="Arial,Noto Sans TC,sans-serif" font-size="25" fill="#182238">入射日光</text><text x="455" y="115" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#182238">90° 方向的觀察者</text><text x="38" y="345" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#175da8">垂直圖面的 E 可向上方輻射</text><text x="38" y="385" font-family="Arial,Noto Sans TC,sans-serif" font-size="23" fill="#175da8">沿觀察方向的 E 不向該方向輻射</text><path d="M650 205L650 285" fill="none" stroke="#175da8" stroke-width="2" marker-end="url(#tip)"/><text x="570" y="325" font-family="Arial,Noto Sans TC,sans-serif" font-size="22" fill="#175da8">感應電場</text></svg>
