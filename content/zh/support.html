<h2>常見問題</h2>
      <details><summary>為什麼有些像素顯示洋紅色？</summary><p>洋紅色標示無法量測的像素。這些像素可能過曝、太暗，或位於四張照片無法對齊的區域。可調整曝光，或將手機放在穩固的支撐物上再拍。</p></details>
      <details><summary>為什麼影像四角變暗？</summary><p>手機殼會遮住超廣角畫面的左上角，取下手機殼即可看到完整畫面，或改用廣角、長焦鏡頭。若是其他位置變暗，請取下轉盤重新吸附，讓鏡頭窗對準後鏡頭。</p></details>
      <details><summary>為什麼偏振角不對？</summary><p>檢查四個角度的拍攝順序，再用水平亮面的反光確認偏光片透光軸。</p></details>
